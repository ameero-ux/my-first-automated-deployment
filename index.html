<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My First Cloud Website - Chat Board</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; color: #1f2937; margin: 0; padding: 30px 16px; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { color: #2563eb; margin: 0 0 6px; }
    h2 { font-weight: normal; color: #4b5563; margin: 0 0 6px; font-size: 1.1rem; }
    .card { background: #fff; max-width: 600px; margin: auto; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.1); overflow: hidden; }
    .bar { background: #2563eb; color: #fff; padding: 12px 16px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .bar small { font-weight: normal; opacity: .85; }
    #messages { height: 340px; overflow-y: auto; padding: 14px; background: #f9fafb; }
    .msg { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; max-width: 85%; }
    .msg.me { background: #dbeafe; border-color: #bfdbfe; margin-left: auto; }
    .msg .who { font-size: .8rem; color: #2563eb; font-weight: bold; }
    .msg .time { font-size: .7rem; color: #9ca3af; margin-left: 6px; font-weight: normal; }
    .msg .text { margin-top: 3px; word-wrap: break-word; }
    .empty { text-align: center; color: #9ca3af; margin-top: 120px; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e5e7eb; flex-wrap: wrap; }
    input { padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; }
    #name { width: 130px; }
    #text { flex: 1; min-width: 150px; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    footer { text-align: center; color: #6b7280; font-size: .85rem; margin-top: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Hello Cloud!</h1>
    <h2>My First Automated Deployment</h2>
    <p>Website deployed using GitHub Actions.</p>
  </header>

  <div class="card">
    <div class="bar"><span>Chat Board</span><small id="mode"></small></div>
    <div id="messages"></div>
    <form id="chat-form">
      <input id="name" placeholder="Your name" maxlength="20" required>
      <input id="text" placeholder="Type a message..." maxlength="300" autocomplete="off" required>
      <button type="submit">Send</button>
    </form>
  </div>
  <footer>Chat Board - hosted on GitHub Pages</footer>

  <script type="module">
    // ---- OPTIONAL: paste your Firebase config here for a real shared chat ----
    // Example: const firebaseConfig = { apiKey: "...", authDomain: "...", projectId: "...", appId: "..." };
    const firebaseConfig = null;
    // --------------------------------------------------------------------------

    const box = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const nameInput = document.getElementById("name");
    const textInput = document.getElementById("text");
    const modeLabel = document.getElementById("mode");

    try { nameInput.value = localStorage.getItem("chat-name") || ""; } catch (e) {}

    function render(list) {
      box.innerHTML = "";
      if (!list.length) {
        const e = document.createElement("div");
        e.className = "empty";
        e.textContent = "No messages yet. Say hello!";
        box.appendChild(e);
        return;
      }
      const me = nameInput.value.trim();
      list.forEach(m => {
        const d = document.createElement("div");
        d.className = "msg" + (m.name === me ? " me" : "");
        const who = document.createElement("div");
        who.className = "who";
        who.textContent = m.name;
        const t = document.createElement("span");
        t.className = "time";
        t.textContent = new Date(m.time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        who.appendChild(t);
        const txt = document.createElement("div");
        txt.className = "text";
        txt.textContent = m.text;
        d.appendChild(who);
        d.appendChild(txt);
        box.appendChild(d);
      });
      box.scrollTop = box.scrollHeight;
    }

    let backend;

    if (firebaseConfig) {
      const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      const db = fs.getFirestore(appMod.initializeApp(firebaseConfig));
      const col = fs.collection(db, "chat-messages");
      modeLabel.textContent = "Online (Firebase)";
      backend = {
        send: m => fs.addDoc(col, m),
        listen: cb => fs.onSnapshot(fs.query(col, fs.orderBy("time"), fs.limit(100)),
          snap => cb(snap.docs.map(d => d.data())))
      };
    } else {
      const KEY = "chat-board-messages";
      const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } };
      modeLabel.textContent = "Local mode (this browser only)";
      backend = {
        send: m => { const l = load(); l.push(m); try { localStorage.setItem(KEY, JSON.stringify(l.slice(-100))); } catch (e) {} return Promise.resolve(); },
        listen: cb => {
          cb(load());
          window.addEventListener("storage", () => cb(load()));
          window.__refreshChat = () => cb(load());
        }
      };
    }

    backend.listen(render);

    form.addEventListener("submit", async e => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const text = textInput.value.trim();
      if (!name || !text) return;
      try { localStorage.setItem("chat-name", name); } catch (err) {}
      await backend.send({ name, text, time: Date.now() });
      textInput.value = "";
      if (window.__refreshChat) window.__refreshChat();
    });
  </script>
</body>
</html>
